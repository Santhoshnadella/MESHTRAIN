[package]
name = "meshcoin_mobile_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
libp2p = { version = "0.52", features = ["tokio", "gossipsub", "kad", "tcp", "noise", "yamux"] }
tokio = { version = "1.0", features = ["full"] }
jni = "0.21.1" # For Android FFI
