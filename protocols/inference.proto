syntax = "proto3";

package meshtrain.protocols;

message InferenceRequest {
  string request_id = 1;
  string sender = 2;
  string model = 3;
  string prompt = 4;
  string modality = 5; // e.g. "text", "image"
}

message InferenceResult {
  string request_id = 1;
  string payload_type = 2; // e.g. "text/plain", "image/png"
  bytes payload = 3;
  string error_message = 4;
}
