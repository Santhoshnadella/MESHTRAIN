[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtrain"
version = "0.1.1"
description = "BitTorrent-inspired zero-trust P2P AI compute network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "multiaddr>=0.0.9"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "diffusers>=0.20.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.21.0"
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0"
]
all = ["meshtrain[ml,api]"]

[project.scripts]
meshtrain = "meshtrain.cli.main:app"
