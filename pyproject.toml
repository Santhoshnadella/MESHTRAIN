[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtrain"
version = "0.1.1"
description = "A BitTorrent-inspired decentralized AI compute network"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MeshTrain Contributors" }
]
dependencies = [
    "typer>=0.9.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "torch>=2.0.0",
    "transformers>=4.33.0",
    "peft>=0.5.0",
    "safetensors>=0.3.3",
    "pydantic>=2.3.0",
    "zeroconf>=0.119.0",
    "libp2p>=0.1.6",
    "multiaddr>=0.0.9"
]

[project.scripts]
meshtrain = "meshtrain.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["meshtrain", "meshtrain.*"]
