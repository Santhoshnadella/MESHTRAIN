version: '3.8'

services:
  meshtrain-node-1:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8001"
    volumes:
      - ./.meshtrain:/app/.meshtrain
    command: meshtrain start --port 8001 --relay

  meshtrain-node-2:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8002:8002"
    volumes:
      - ./.meshtrain_2:/app/.meshtrain
    command: meshtrain start --port 8002 --relay --bootstrap /ip4/meshtrain-node-1/tcp/8001
